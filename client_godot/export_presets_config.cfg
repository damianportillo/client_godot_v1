# Configuración de exportación para Android - Neighborhood AI

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="android/*, scripts/tests/*"
export_path="../builds/NeighborhoodAI.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

# Configuración de Android específicos para optimización gráfica
custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=false
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
texture_format/vram_compression_quality=0.75

# Configuraciones de rendimiento para Android
android/force_32_bits_coordinates=false
android/force_64_bits_coordinates=false
android/force_32_bits_indices=false
android/force_64_bits_indices=false

# Optimizaciones gráficas
android/enable_vulkan=true
android/enable_gles3=true
android/enable_gles2=false

# Configuración de hardware
android/hardware_acceleration=true
android/max_texture_size=2048
android/min_texture_size=512

# Configuración de rendimiento
android/enable_performance_profiling=false
android/enable_debugging=false
android/enable_optimization=false
android/enable_low_memory=false

# Configuración de recursos
android/enable_texture_compression=true
android/enable_culling=true
android/enable_batching=true
android/enable_shader_optimization=true